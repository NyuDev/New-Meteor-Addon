# AF_UNIX socket fix - this PC's JDK fails to open NIO selectors unless the
# domain socket dir is a short valid path. C:/Temp avoids the crash.
# This is a Windows-only workaround: CI overrides org.gradle.jvmargs on the
# command line so the C:/ path never reaches a Linux runner.
org.gradle.jvmargs=-Xmx3G -Djdk.net.unixdomain.tmpdir=C:/Temp
org.gradle.parallel=true

# Meteor Client publishes its own Loom version in its POM metadata; don't fail
# the build when it differs from ours.
loom.ignoreDependencyLoomVersionValidation=true

# Fabric Loader version (shared across all Minecraft versions).
# Per-version Meteor, Minecraft, and mappings coordinates are resolved in
# build.gradle.kts; the version list lives in versions.json / Stonecutter.
loader_version=0.19.3

# Mod properties
mod_version=0.8.8
maven_group=fr.nyuway
archives_base_name=new
